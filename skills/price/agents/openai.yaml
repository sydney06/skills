# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Price"
  short_description: "Classify, quote, SOW, audit and approve a feature fee"
  default_prompt: "Run the price skill: read its SKILL.md, then classify, quote, register the SOW for, audit, or approve this feature, as the command asks."
